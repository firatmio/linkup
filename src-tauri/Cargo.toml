[package]
name = "linkup"
version = "0.1.0"
description = "LinkUp — LAN üzerinden cihazlar arası sohbet ve dosya transferi"
authors = ["firatmio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linkup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
tracing = "0.1.44"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
r2d2 = "0.8.10"
getrandom = "0.4.3"
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
quinn = "0.11.11"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.10"
postcard = { version = "1.1.3", features = ["use-std"] }
x509-parser = "0.18.1"
rustls-pki-types = "1.15.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
mdns-sd = "0.21.1"
if-addrs = "0.15.0"
blake3 = "1.8.7"
fs4 = { version = "1.1.0", features = ["sync"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-winrt-notification = "0.8.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }
